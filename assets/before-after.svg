<text x="36" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="start">What the safeguards changed</text><text x="36" y="68" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Each safeguard came from a failure seen in testing. Bars are schematic; only time is to scale.</text><text x="36" y="104" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Time per ticket</text><text x="36" y="124" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">about 20× faster</text><rect x="300" y="90" width="520" height="26" rx="7" fill="#21262d" stroke="none" stroke-width="1"/><rect x="300" y="90" width="520" height="26" rx="7" fill="#f85149" stroke="none" stroke-width="1"/><text x="312" y="108" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0d1117" text-anchor="start">before  ~30 s</text><rect x="300" y="122" width="520" height="26" rx="7" fill="#21262d" stroke="none" stroke-width="1"/><rect x="300" y="122" width="24.44" height="26" rx="7" fill="#a371f7" stroke="none" stroke-width="1"/><text x="336.44" y="140" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#a371f7" text-anchor="start">after  1.4 s</text><text x="36" y="200" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Failed tickets</text><text x="36" y="220" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">format auto-repair and bounded retries</text><rect x="300" y="186" width="520" height="26" rx="7" fill="#21262d" stroke="none" stroke-width="1"/><rect x="300" y="186" width="520" height="26" rx="7" fill="#f85149" stroke="none" stroke-width="1"/><text x="312" y="204" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0d1117" text-anchor="start">before  4</text><rect x="300" y="218" width="520" height="26" rx="7" fill="#21262d" stroke="none" stroke-width="1"/><rect x="300" y="218" width="6" height="26" rx="7" fill="#58a6ff" stroke="none" stroke-width="1"/><text x="318" y="236" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#58a6ff" text-anchor="start">after  0</text><text x="36" y="296" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Wrong totals</text><text x="36" y="316" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">total always computed by code</text><rect x="300" y="282" width="520" height="26" rx="7" fill="#21262d" stroke="none" stroke-width="1"/><rect x="300" y="282" width="520" height="26" rx="7" fill="#f85149" stroke="none" stroke-width="1"/><text x="312" y="300" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0d1117" text-anchor="start">before  ~1 in 6</text><rect x="300" y="314" width="520" height="26" rx="7" fill="#21262d" stroke="none" stroke-width="1"/><rect x="300" y="314" width="6" height="26" rx="7" fill="#3fb950" stroke="none" stroke-width="1"/><text x="318" y="332" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#3fb950" text-anchor="start">after  0</text>
</svg>