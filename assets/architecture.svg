<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="538" viewBox="0 0 1000 538" role="img">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="537" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="36" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="start">One orchestrator, four sub-workflows</text><text x="36" y="68" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Each part has a single job and can be tested on its own.</text><rect x="36" y="92" width="928" height="260" rx="10" fill="#1c1230" stroke="#ea4b71" stroke-width="1"/><text x="54" y="116" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#ea4b71" text-anchor="start" letter-spacing="2">ORCHESTRATOR WORKFLOW</text><rect x="54" y="190" width="120" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="114" y="215" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" text-anchor="middle">Webhook</text><text x="114" y="233" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">ticket arrives</text><rect x="206" y="184" width="140" height="68" rx="10" fill="#161b22" stroke="#ea4b71" stroke-width="1"/><text x="276" y="215" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" text-anchor="middle">Router</text><text x="276" y="233" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">by intention</text><path d="M174 218 H202" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/><rect x="418" y="130" width="224" height="146" rx="10" fill="none" stroke="#d29922" stroke-width="1.5" stroke-dasharray="5 4"/><text x="530" y="279" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start"></text><text x="530" y="121" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#d29922" text-anchor="middle" letter-spacing="1">USE THE SHARED LIST SERVICE (CACHED)</text><rect x="430" y="140" width="200" height="38" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1"/><text x="530" y="164" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" text-anchor="middle">Intention 1</text><path d="M346 218 C390 218 390 159 426 159" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/><path d="M630 159 C680 159 680 218 716 218" fill="none" stroke="#8b949e" stroke-width="1.5"/><rect x="430" y="184" width="200" height="38" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1"/><text x="530" y="208" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" text-anchor="middle">Intention 2</text><path d="M346 218 C390 218 390 203 426 203" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/><path d="M630 203 C680 203 680 218 716 218" fill="none" stroke="#8b949e" stroke-width="1.5"/><rect x="430" y="228" width="200" height="38" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1"/><text x="530" y="252" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" text-anchor="middle">Intention 3</text><path d="M346 218 C390 218 390 247 426 247" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/><path d="M630 247 C680 247 680 218 716 218" fill="none" stroke="#8b949e" stroke-width="1.5"/><rect x="430" y="292" width="200" height="38" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1"/><text x="530" y="316" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" text-anchor="middle">Intention 4</text><path d="M346 218 C390 218 390 311 426 311" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/><path d="M630 311 C680 311 680 218 716 218" fill="none" stroke="#8b949e" stroke-width="1.5"/><rect x="716" y="184" width="230" height="68" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1"/><text x="831" y="215" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" text-anchor="middle">Normalise and store</text><text x="831" y="233" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">same 48 fields on every route</text><text x="36" y="378" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b949e" text-anchor="start">Inside an evaluator (same pattern, built twice with different rules)</text><rect x="36" y="398" width="132" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="102" y="433" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" text-anchor="middle">Trigger</text><path d="M170 428 H190" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/><rect x="192" y="398" width="132" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="258" y="433" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" text-anchor="middle">Prepare inputs</text><path d="M326 428 H346" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/><rect x="348" y="398" width="132" height="60" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1"/><text x="414" y="425" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" text-anchor="middle">AI scoring</text><text x="414" y="443" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">model + output parser</text><path d="M482 428 H502" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/><rect x="504" y="398" width="132" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="570" y="425" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" text-anchor="middle">List lookup</text><text x="570" y="443" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">shared service</text><path d="M638 428 H658" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/><rect x="660" y="398" width="132" height="60" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1"/><text x="726" y="425" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" text-anchor="middle">Validation code</text><text x="726" y="443" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">rules and checks</text><path d="M794 428 H814" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/><rect x="816" y="398" width="132" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="882" y="433" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" text-anchor="middle">Record</text><rect x="192" y="480" width="436" height="34" rx="8" fill="none" stroke="#f85149" stroke-width="1" stroke-dasharray="5 4"/><text x="410" y="502" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#f85149" text-anchor="middle">On failure: logged as a record, never dropped</text><path d="M348 458 V478" stroke="#f85149" stroke-width="2" stroke-dasharray="5 4"/>
</svg>