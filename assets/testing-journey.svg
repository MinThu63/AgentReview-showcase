<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="424" viewBox="0 0 1000 424" role="img">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="423" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="36" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="start">Three testing phases</text><text x="36" y="68" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Same loop each round: run all tickets, review, find the cause, fix, rerun and compare.</text><line x1="330" y1="102" x2="330" y2="318" stroke="#30363d" stroke-dasharray="2 4"/><text x="330" y="338" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">75%</text><line x1="442" y1="102" x2="442" y2="318" stroke="#30363d" stroke-dasharray="2 4"/><text x="442" y="338" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">80%</text><line x1="554" y1="102" x2="554" y2="318" stroke="#30363d" stroke-dasharray="2 4"/><text x="554" y="338" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">85%</text><line x1="666" y1="102" x2="666" y2="318" stroke="#30363d" stroke-dasharray="2 4"/><text x="666" y="338" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">90%</text><line x1="778" y1="102" x2="778" y2="318" stroke="#30363d" stroke-dasharray="2 4"/><text x="778" y="338" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">95%</text><line x1="890" y1="102" x2="890" y2="318" stroke="#30363d" stroke-dasharray="2 4"/><text x="890" y="338" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">100%</text><text x="36" y="136" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">1 · Synthetic</text><text x="36" y="155" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">24 AI-generated, anonymised tickets</text><text x="36" y="172" font-family="ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">4 rounds</text><line x1="419.6" y1="148" x2="890" y2="148" stroke="#58a6ff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.6"/><circle cx="419.6" cy="148" r="8" fill="#0d1117" stroke="#58a6ff" stroke-width="3"/><text x="419.6" y="128" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b949e" text-anchor="middle">79%</text><circle cx="890" cy="148" r="9" fill="#58a6ff"/><text x="890" y="128" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#58a6ff" text-anchor="middle">100%</text><text x="36" y="214" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">2 · Real, first set</text><text x="36" y="233" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">88 anonymised tickets, 12 languages</text><text x="36" y="250" font-family="ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">5 rounds · 214 runs</text><line x1="778" y1="226" x2="867.6" y2="226" stroke="#a371f7" stroke-width="5" stroke-linecap="round" stroke-opacity="0.6"/><circle cx="778" cy="226" r="8" fill="#0d1117" stroke="#a371f7" stroke-width="3"/><text x="778" y="206" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b949e" text-anchor="middle">95%</text><circle cx="867.6" cy="226" r="9" fill="#a371f7"/><text x="867.6" y="206" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#a371f7" text-anchor="middle">99%</text><text x="36" y="292" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">3 · Real, new set</text><text x="36" y="311" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">172 anonymised English tickets</text><text x="36" y="328" font-family="ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">5 rounds</text><circle cx="822.8" cy="304" r="9" fill="#3fb950"/><text x="822.8" y="284" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#3fb950" text-anchor="middle">97%</text><rect x="36" y="360" width="928" height="40" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1"/><text x="54" y="385" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">Phase 3 reached 97% on a model about 20 times faster, with safeguards added for every failure seen.</text>
</svg>