<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="434" viewBox="0 0 1000 434" role="img">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="433" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="36" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="start">AI judges, code verifies</text><text x="36" y="68" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">The model gives the judgement. Plain code does everything that can be checked exactly.</text><rect x="36" y="96" width="420" height="250" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1"/><text x="56" y="122" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#a371f7" text-anchor="start" letter-spacing="2">AI MODEL</text><rect x="56" y="140" width="380" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/><rect x="56" y="140" width="5" height="44" rx="2" fill="#58a6ff"/><text x="76" y="168" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">Relevance score</text><rect x="56" y="196" width="380" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/><rect x="56" y="196" width="5" height="44" rx="2" fill="#a371f7"/><text x="76" y="224" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">Meaning score</text><rect x="56" y="252" width="380" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/><rect x="56" y="252" width="5" height="44" rx="2" fill="#d29922"/><text x="76" y="280" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">Sources score</text><text x="246" y="330" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">three part scores, nothing else</text><path d="M458 220 H520" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/><rect x="522" y="96" width="442" height="250" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1"/><text x="542" y="122" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#3fb950" text-anchor="start" letter-spacing="2">PLAIN CODE</text><text x="542" y="154" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#3fb950" text-anchor="start">✓</text><text x="566" y="154" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">Caps each score</text><text x="566" y="172" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">one wrong answer cannot break a number</text><text x="542" y="202" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#3fb950" text-anchor="start">✓</text><text x="566" y="202" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">Applies the rules</text><text x="566" y="220" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">priority order, multilingual keywords, firmware rule</text><text x="542" y="250" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#3fb950" text-anchor="start">✓</text><text x="566" y="250" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">Checks claims against a list</text><text x="566" y="268" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">only an official list can confirm "discontinued"</text><text x="542" y="298" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#3fb950" text-anchor="start">✓</text><text x="566" y="298" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">Computes the total</text><text x="566" y="316" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">always the sum of the parts</text><rect x="36" y="366" width="928" height="44" rx="10" fill="#2a2210" stroke="#6b4e12" stroke-width="1"/><text x="54" y="393" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e3b341" text-anchor="start">Why: a smaller model added the total up wrongly on about 1 in 6 tickets. Now the total is always the sum of the parts.</text>
</svg>